name: Testing and dependencies integration
on:
  push:
    branches: [ release/maven-and-testing ]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Maven test
      run: xvfb-run --auto-servernum mvn test --file pom.xml
